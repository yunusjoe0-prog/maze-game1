<!doctype html>

<title>متاهة الهروب - Maze Escape</title>
<meta name="description" content="لعبة متاهة مجانية: اجمع العملات واعثر على المفتاح وتجنب الوحوش عبر 10 مراحل.">
<!-- AdSense: استبدل ca-pub-XXXXXXXXXXXXXXXX برقم الناشر بعد قبول حسابك -->

<style>
html,body{margin:0;height:100%;background:#0f1220;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#w{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top);box-sizing:border-box}
#ad{height:60px;flex:none;overflow:hidden;text-align:center;background:#151a2e}
#g{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block}

<body>
<div id="w">
  <div id="ad"><ins class="adsbygoogle" style="display:block;height:60px" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="1111111111" data-ad-format="horizontal"></ins></div>
  <div id="g"><canvas id="c"></canvas></div>
</div>
<script>
if(!/XXXX/.test(document.querySelector('ins').dataset.adClient)){try{(adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}}

/* ===== إعدادات يمكنك تعديلها ===== */
const MAX_LEVEL=10,COINS=5,MOVE_DELAY=.14,TRAP_CYCLE=1.2,TRAP_PENALTY=5;
// time=مضاعف الوقت، lives=الأرواح، mi=فاصل حركة الوحوش(أقل=أسرع)، me=وحوش إضافية، tr=مضاعف الفخاخ، ch=مرحلة بدء المطاردة
const DIFF=[{n:['EASY','سهل'],time:1.35,lives:5,mi:1.3,me:-1,tr:.6,ch:6},
{n:['NORMAL','عادي'],time:1,lives:3,mi:1,me:0,tr:1,ch:4},
{n:['HARD','صعب'],time:.8,lives:2,mi:.75,me:1,tr:1.3,ch:2}];
/* ================================= */

const T={title:['MAZE ESCAPE','متاهة الهروب'],t1:['Collect 5 gold coins','اجمع 5 عملات ذهبية'],t2:['Find the key','اعثر على المفتاح'],
t3:['Avoid monsters & spikes','تجنب الوحوش والفخاخ'],t4:['Reach the golden door','صل إلى الباب الذهبي'],t5:['Beat the clock!','اسبق الوقت!'],
t6:['10 levels, harder each time','10 مراحل وتزداد صعوبة'],diff:['DIFFICULTY','الصعوبة'],start:['START','ابدأ'],
level:['LEVEL {0}/{1}','المرحلة {0}/{1}'],time:['TIME {0}','الوقت {0}'],score:['SCORE {0}','النقاط {0}'],coins:['COINS {0}/{1}','العملات {0}/{1}'],
ky:['KEY: YES','المفتاح: نعم'],kn:['KEY: NO','المفتاح: لا'],lives:['LIVES: {0}','الأرواح: {0}'],need:['Need the key + 5 coins!','تحتاج المفتاح و 5 عملات!'],
clear:['LEVEL CLEAR!','أحسنت! المرحلة انتهت'],next:['Next: level {0}','التالية: المرحلة {0}'],sc:['Score: {0}','النقاط: {0}'],
over:['GAME OVER','انتهت اللعبة'],r_time:['Time is up!','انتهى الوقت!'],r_mon:['The monsters got you!','أمسكت بك الوحوش!'],
retry:['Retry level {0}','أعد المرحلة {0}'],final:['YOU ESCAPED!','لقد هربت!'],all:['All 10 levels done','أنهيت المراحل العشر'],
fsc:['Final score: {0}','النتيجة النهائية: {0}'],tap:['TAP TO CONTINUE','المس للمتابعة']};
let lang=(navigator.language||'').startsWith('ar')?1:0;
const tr=(k,...a)=>T[k][lang].replace(/\{(\d)\}/g,(_,i)=>a[i]);

const W=480,TOP=70,PAD_R=38,DIRS=[[-1,0],[0,1],[1,0],[0,-1]];
const cv=document.getElementById('c'),x=cv.getContext('2d');
let H=800,K=1,MH=495,PAD={};
function fit(){const g=document.getElementById('g'),aw=g.clientWidth,ah=g.clientHeight;
 H=Math.max(800,Math.min(1150,Math.round(W*ah/aw)));K=Math.min(aw/W,ah/H);
 const s=K*(window.devicePixelRatio||1);cv.width=Math.round(W*s);cv.height=Math.round(H*s);
 cv.style.width=W*K+'px';cv.style.height=H*K+'px';x.setTransform(s,0,0,s,0,0);
 MH=H-TOP-235;const cy=H-110;PAD={0:[240,cy-60],1:[335,cy],2:[240,cy+60],3:[145,cy]};}
addEventListener('resize',fit);

/* ===== صوت ===== */
let ac;function A(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
const SND={coin:[[988,.06],[1319,.12]],key:[[660,.08],[880,.08],[1175,.15]],hit:[[200,.15],[120,.25]],trap:[[300,.1],[150,.2]],
win:[[523,.1],[659,.1],[784,.1],[1047,.25]],lose:[[392,.2],[330,.2],[262,.4]],locked:[[180,.15]]};
function snd(n){if(!ac)return;let t=ac.currentTime;for(const[f,d]of SND[n]){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;
 g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);t+=d}}

/* ===== المتاهة ===== */
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function maze(R,C){const w=[...Array(R)].map(()=>[...Array(C)].map(()=>[1,1,1,1]));
 const seen=new Set(['0,0']),s=[[0,0]];
 while(s.length){const[r,c]=s[s.length-1],nb=[];
  DIRS.forEach(([dr,dc],d)=>{const nr=r+dr,nc=c+dc;if(nr>=0&&nr<R&&nc>=0&&nc<C&&!seen.has(nr+','+nc))nb.push([d,nr,nc])});
  if(nb.length){const[d,nr,nc]=nb[rnd(nb.length)];w[r][c][d]=0;w[nr][nc][(d+2)%4]=0;seen.add(nr+','+nc);s.push([nr,nc])}else s.pop()}
 for(let i=0;i<R*C/10;i++){const r=rnd(R),c=rnd(C),d=rnd(4),nr=r+DIRS[d][0],nc=c+DIRS[d][1];
  if(nr>=0&&nr<R&&nc>=0&&nc<C){w[r][c][d]=0;w[nr][nc][(d+2)%4]=0}}
 return w}

/* ===== الحالة ===== */
let st='menu',stT=0,diff=1,level=1,score=0,reason='r_time';
let rows,cols,cell,ox,oy,walls,ex,mons,key,coins,traps,pr,pc,vx,vy,vis,got,hasKey,lives,tl,t,cd,inv,flash,mt,mi,msg,msgT;
const setSt=s=>{st=s;stT=0};
function startLevel(){const D=DIFF[diff],lv=level;
 cols=6+((lv+1)>>1);cell=Math.floor(W/cols);rows=Math.max(cols,Math.floor(MH/cell));
 ox=(W-cell*cols)>>1;oy=TOP+Math.max(0,(MH-cell*rows)>>1);walls=maze(rows,cols);ex=[rows-1,cols-1];
 let cells=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(!(r===0&&c===0)&&!(r===ex[0]&&c===ex[1]))cells.push([r,c]);
 shuffle(cells);const far=cells.filter(p=>p[0]+p[1]>=5),nm=Math.max(1,((lv+1)>>1)+D.me);mons=[];
 far.slice(0,nm).forEach(p=>{cells.splice(cells.indexOf(p),1);mons.push({r:p[0],c:p[1],d:rnd(4)})});
 key=cells.pop();coins=[];for(let i=0;i<COINS;i++)coins.push(cells.pop());
 traps=[];for(let i=0;i<Math.max(1,Math.floor(Math.min(lv+1,8)*D.tr));i++)traps.push(cells.pop());
 pr=pc=0;vx=vy=0;vis=new Set(['0,0']);got=0;hasKey=false;lives=D.lives;
 tl=Math.floor((Math.floor(rows*cols*.6)+20-lv*2+15)*D.time);t=0;cd=0;inv=1;flash=0;mt=0;
 mi=Math.max(.2,(.7-.04*lv)*D.mi);msg='';msgT=0;setSt('play')}

const same=(a,r,c)=>a[0]===r&&a[1]===c;
const trapOn=()=>Math.floor(t/TRAP_CYCLE)%2===0;
function hurt(){pr=pc=0;vx=vy=0;inv=1.5;flash=.3}
function end(r){reason=r;snd('lose');setSt('gameover')}
function hazards(){if(inv>0)return;
 if(traps.some(p=>same(p,pr,pc))&&trapOn()){tl-=TRAP_PENALTY;snd('trap');hurt();return}
 if(mons.some(m=>m.r===pr&&m.c===pc)){lives--;snd('hit');hurt();if(lives<=0)end('r_mon')}}
function step(d){if(walls[pr][pc][d])return;pr+=DIRS[d][0];pc+=DIRS[d][1];vis.add(pr+','+pc);
 const i=coins.findIndex(p=>same(p,pr,pc));if(i>=0){coins.splice(i,1);got++;score+=10;snd('coin')}
 if(!hasKey&&same(key,pr,pc)){hasKey=true;score+=20;snd('key')}
 if(same(ex,pr,pc)){if(hasKey&&got>=COINS){score+=Math.floor(tl)*2;snd('win');setSt(level>=MAX_LEVEL?'final':'levelwin');return}
  if(msgT<=0)snd('locked');msg='need';msgT=1.5}
 hazards()}
function moveMons(){const chase=level>=DIFF[diff].ch;
 for(const m of mons){let o=[0,1,2,3].filter(d=>!walls[m.r][m.c][d]);const b=(m.d+2)%4;
  if(o.length>1&&o.includes(b))o=o.filter(d=>d!==b);
  let d;if(chase&&Math.random()<.3){o.sort((a,b2)=>Math.abs(m.r+DIRS[a][0]-pr)+Math.abs(m.c+DIRS[a][1]-pc)-Math.abs(m.r+DIRS[b2][0]-pr)-Math.abs(m.c+DIRS[b2][1]-pc));d=o[0]}else d=o[rnd(o.length)];
  m.r+=DIRS[d][0];m.c+=DIRS[d][1];m.d=d}}

/* ===== إدخال ===== */
const keys={},ptr={down:false,x:0,y:0};
const KM={ArrowUp:0,w:0,ArrowRight:1,d:1,ArrowDown:2,s:2,ArrowLeft:3,a:3};
addEventListener('keydown',e=>{A();keys[e.key]=1;if(st!=='play'&&st!=='menu')tap(-1,-1);if(st==='menu'&&(e.key==='Enter'||e.key===' '))begin()});
addEventListener('keyup',e=>delete keys[e.key]);
function lp(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/K,(e.clientY-r.top)/K]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();A();const[px,py]=lp(e);ptr.down=true;ptr.x=px;ptr.y=py;tap(px,py)});
cv.addEventListener('pointermove',e=>{if(ptr.down){[ptr.x,ptr.y]=lp(e)}});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>ptr.down=false));
function readDir(){for(const k in keys)if(k in KM)return KM[k];
 if(ptr.down)for(const d in PAD){const[px,py]=PAD[d];if((ptr.x-px)**2+(ptr.y-py)**2<=(PAD_R+8)**2)return +d}
 return null}
function mrects(){const sy=Math.floor(H*.72),dy=sy-110;return{dy,sy,d:[0,1,2].map(i=>[85+155*i-65,dy-28,130,56]),s:[90,sy-42,300,84],l:[W-90,10,80,40]}}
const inR=(r,px,py)=>px>=r[0]&&px<=r[0]+r[2]&&py>=r[1]&&py<=r[1]+r[3];
function begin(){level=1;score=0;startLevel()}
function tap(px,py){
 if(st==='menu'){if(stT<.2)return;const m=mrects();if(inR(m.l,px,py)){lang=1-lang;return}
  for(let i=0;i<3;i++)if(inR(m.d[i],px,py)){diff=i;return}if(inR(m.s,px,py))begin();return}
 if(st==='play'||stT<.5)return;
 if(st==='levelwin'){level++;startLevel()}else if(st==='gameover')startLevel();else if(st==='final')setSt('menu')}

/* ===== تحديث ===== */
function update(dt){stT+=dt;if(st!=='play')return;
 t+=dt;tl-=dt;inv=Math.max(0,inv-dt);flash=Math.max(0,flash-dt);msgT=Math.max(0,msgT-dt);cd-=dt;
 const d=readDir();if(d!==null&&cd<=0){step(d);cd=MOVE_DELAY}
 if(st!=='play')return;
 const k=Math.min(1,dt*16);vx+=(pc-vx)*k;vy+=(pr-vy)*k;
 mt+=dt;if(mt>=mi){mt=0;moveMons()}
 hazards();if(st==='play'&&tl<=0){tl=0;end('r_time')}}

/* ===== رسم ===== */
function txt(s,size,col,cx,cy){x.font='bold '+size+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle=col;x.fillText(s,cx,cy)}
const cp=(r,c)=>[ox+(c+.5)*cell,oy+(r+.5)*cell];
function circ(px,py,r,col){x.fillStyle=col;x.beginPath();x.arc(px,py,r,0,7);x.fill()}
function rr(a,b,w,h,r,fill,line){x.beginPath();x.roundRect(a,b,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(line){x.strokeStyle=line;x.lineWidth=3;x.stroke()}}
function drawMaze(){const cs=cell;
 x.fillStyle='#1c3c3e';vis.forEach(k=>{const[r,c]=k.split(',').map(Number);x.fillRect(ox+c*cs,oy+r*cs,cs,cs)});
 rr(ox+ex[1]*cs+4,oy+ex[0]*cs+4,cs-8,cs-8,8,hasKey&&got>=COINS?'#3cc88c':'#c89628');
 circ(ox+ex[1]*cs+cs*.7,oy+ex[0]*cs+cs*.5,Math.max(2,cs/12),'#281e0a');
 x.strokeStyle='#647396';x.lineWidth=4;x.lineCap='round';x.beginPath();
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const a=ox+c*cs,b=oy+r*cs,w=walls[r][c];
  if(w[0]){x.moveTo(a,b);x.lineTo(a+cs,b)}if(w[3]){x.moveTo(a,b);x.lineTo(a,b+cs)}
  if(r===rows-1){x.moveTo(a,b+cs);x.lineTo(a+cs,b+cs)}if(c===cols-1){x.moveTo(a+cs,b);x.lineTo(a+cs,b+cs)}}
 x.stroke();
 const on=trapOn(),q=cs*.28;
 for(const[r,c]of traps){const[cx,cy]=cp(r,c);if(on){x.fillStyle='#dc5a5a';for(const dx of[-q,0,q]){x.beginPath();x.moveTo(cx+dx-q/2,cy+q);x.lineTo(cx+dx+q/2,cy+q);x.lineTo(cx+dx,cy-q);x.fill()}}else circ(cx,cy,Math.max(2,cs/10),'#5a5a6e')}
 for(const[r,c]of coins){const[cx,cy]=cp(r,c);circ(cx,cy,cs*.22,'#dcaa1e');circ(cx,cy,cs*.16,'#ffdc3c')}
 if(!hasKey){const[cx,cy]=cp(key[0],key[1]);x.strokeStyle='#78c8ff';x.lineWidth=3;x.beginPath();x.arc(cx-cs*.12,cy,cs*.13,0,7);
  x.moveTo(cx,cy);x.lineTo(cx+cs*.25,cy);x.moveTo(cx+cs*.2,cy);x.lineTo(cx+cs*.2,cy+cs*.12);x.stroke()}
 for(const m of mons){const[cx,cy]=cp(m.r,m.c),rad=cs*.3;circ(cx,cy,rad,'#e64646');
  for(const s of[-1,1]){circ(cx+s*rad*.4,cy-rad*.2,Math.max(2,rad/4),'#ebeef5');circ(cx+s*rad*.4,cy-rad*.2,Math.max(1,rad/8),'#141414')}}
 if(inv<=0||Math.floor(t*10)%2===0){const px=ox+(vx+.5)*cs,py=oy+(vy+.5)*cs,rad=cs*.3;circ(px,py,rad,'#ffdc3c');circ(px-rad*.3,py-rad*.3,Math.max(2,rad/3),'#fffab4')}}
function hud(){txt(tr('level',level,MAX_LEVEL),26,'#ebeef5',90,20);txt(tr('time',Math.ceil(tl)),26,tl<10?'#e64646':'#ebeef5',240,20);
 txt(tr('score',score),26,'#ffdc3c',390,20);txt(tr('coins',got,COINS),19,'#ffdc3c',90,52);txt(tr(hasKey?'ky':'kn'),19,'#78c8ff',240,52);
 txt(tr('lives',lives),19,'#e64646',390,52);if(msgT>0)txt(tr(msg),26,'#ffdc3c',W/2,TOP+MH+14)}
function pad(){const d0=readDir();for(const d in PAD){const[px,py]=PAD[d];circ(px,py,PAD_R,d0===+d?'#465578':'#242c46');
 x.strokeStyle='#647396';x.lineWidth=3;x.beginPath();x.arc(px,py,PAD_R,0,7);x.stroke();const a=14;
 const P={0:[[0,-a],[-a,a/2],[a,a/2]],1:[[a,0],[-a/2,-a],[-a/2,a]],2:[[0,a],[-a,-a/2],[a,-a/2]],3:[[-a,0],[a/2,-a],[a/2,a]]}[d];
 x.fillStyle='#ebeef5';x.beginPath();P.forEach(([u,v],i)=>i?x.lineTo(px+u,py+v):x.moveTo(px+u,py+v));x.fill()}}
function ov(title,lines,col){x.fillStyle='rgba(0,0,0,.75)';x.fillRect(0,0,W,H);const m=H/2;txt(title,46,col,W/2,m-150);
 lines.forEach((l,i)=>txt(l,26,'#ebeef5',W/2,m-70+i*46));if(Math.floor(stT*2)%2===0)txt(tr('tap'),26,'#3cbe8c',W/2,m+200)}
function drawMenu(){txt(tr('title'),46,'#ffdc3c',W/2,105);for(let i=1;i<=6;i++)txt(tr('t'+i),26,'#ebeef5',W/2,140+i*40);
 const m=mrects();txt(tr('diff'),19,'#828ca5',W/2,m.dy-48);
 m.d.forEach((r,i)=>{const s=i===diff;rr(r[0],r[1],r[2],r[3],14,s?'#2d6e5a':'#242c46',s?'#3cbe8c':'#647396');txt(DIFF[i].n[lang],19,'#fff',r[0]+r[2]/2,r[1]+r[3]/2)});
 rr(m.s[0],m.s[1],m.s[2],m.s[3],20,'#c89628');txt(tr('start'),46,'#1e1605',W/2,m.sy);
 rr(m.l[0],m.l[1],m.l[2],m.l[3],10,'#242c46','#647396');txt(lang?'EN':'عربي',19,'#fff',m.l[0]+40,m.l[1]+20)}
function draw(){x.fillStyle='#0f1220';x.fillRect(0,0,W,H);if(st==='menu'){drawMenu();return}
 drawMaze();hud();pad();if(flash>0){x.fillStyle='rgba(255,0,0,'+.47*flash/.3+')';x.fillRect(0,0,W,H)}
 if(st==='levelwin')ov(tr('clear'),[tr('sc',score),tr('next',level+1)],'#ffdc3c');
 else if(st==='gameover')ov(tr('over'),[tr(reason),tr('sc',score),tr('retry',level)],'#e64646');
 else if(st==='final')ov(tr('final'),[tr('all'),tr('fsc',score)],'#ffdc3c')}

fit();let last=performance.now();
(function loop(n){const dt=Math.min((n-last)/1000,.05);last=n;update(dt);draw();requestAnimationFrame(loop)})(last);
</script>
</body>
